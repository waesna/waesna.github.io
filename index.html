<style>
:root{
  --paper:#F7F4EE; --raise:#FFFDF9; --ink:#17140F; --ink-2:#514B41; --ink-3:#8B8376;
  --rule:#E4DCCE; --accent:#B97F3A; --accent-2:#D9A45E;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Geist","Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(20px,5vw,84px); --ease:cubic-bezier(.2,.7,.3,1);
  --t-hero:clamp(40px,5.8vw,80px); --t-sec:clamp(28px,3.2vw,40px); --t-card:19px; --t-body:16px; --t-small:14px; --t-mono:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#111010; --raise:#191715; --ink:#F4F0E8; --ink-2:#B5AC9E; --ink-3:#847B6E; --rule:#2B2723;
}}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:var(--t-body)/1.65 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.04}
h1{font-size:var(--t-hero)} h1 em{font-style:normal;color:var(--accent)}
h2{font-size:var(--t-sec)} h3{font-size:var(--t-card);letter-spacing:-.01em;line-height:1.25}
.mono{font:500 var(--t-mono)/1.5 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
section{padding:clamp(64px,9vw,120px) var(--pad);border-top:1px solid var(--rule)}
.sec-head{margin-bottom:40px}
.lead{color:var(--ink-2);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:2px;font-size:15px;font-weight:600;border:1px solid var(--ink);transition:.2s var(--ease)}
.btn.solid{background:var(--ink);color:var(--paper)} .btn.solid:hover{background:var(--accent);border-color:var(--accent)}
.btn.line:hover{background:var(--ink);color:var(--paper)}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px var(--pad);
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.on{border-bottom-color:var(--rule)}
.logo{display:flex;align-items:center;gap:11px;font:600 15px/1 var(--display);letter-spacing:.16em}
.logo img{height:26px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo img{filter:invert(1)}}
.nav-links{display:flex;gap:24px;font-size:var(--t-small);color:var(--ink-2)} .nav-links a:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.lang button{padding:6px 10px;font:500 12px/1 var(--mono);color:var(--ink-3)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
@media (max-width:860px){.nav-links{display:none}.nav .btn{display:none}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(30px,5vw,64px);align-items:center;padding:clamp(52px,8vw,110px) var(--pad)}
.hero .lead{margin-top:20px;font-size:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:var(--t-small);color:var(--ink-3)}
.trust span{display:flex;align-items:center;gap:7px}
.trust span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (max-width:920px){.hero{grid-template-columns:1fr}}
/* hero showcase: iki ürün amblemi */
.showcase{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sc{aspect-ratio:1/1;border:1px solid var(--rule);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:.25s var(--ease)}
.sc:hover{border-color:var(--accent);transform:translateY(-3px)}
.sc img{width:44%;height:auto}
.sc.in{background:#0B0E13}
.sc b{font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.sc.in b{color:#EAF0FF}
/* ürünler */
.prods{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.prod-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:30px;border:1px solid var(--rule);border-radius:4px;background:var(--raise);transition:.25s var(--ease)}
.prod-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 18px 44px -28px rgba(0,0,0,.5)}
.pc-logo{width:58px;height:58px;display:grid;place-items:center;border-radius:13px;overflow:hidden}
.pc-logo img{width:100%;height:100%;object-fit:contain}
.pc-logo.in{background:#0B0E13;padding:11px}
.pc-desc{color:var(--ink-2);font-size:var(--t-small);flex:1}
.pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:15px;border-top:1px solid var(--rule)}
.pc-price{font:600 22px/1 var(--display);letter-spacing:-.02em}
.pc-price small{font:400 12px/1 var(--body);color:var(--ink-3);margin-left:5px}
.pc-cta{font-size:14px;font-weight:600;color:var(--accent)}
.pc-cta::after{content:" →";transition:.2s var(--ease)}
.prod-card:hover .pc-cta::after{margin-left:3px}
.pc-badge{position:absolute;top:16px;right:16px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--paper);background:var(--accent);padding:5px 9px;border-radius:2px}
@media(max-width:760px){.prods{grid-template-columns:1fr}.showcase{grid-template-columns:1fr 1fr}}
/* manifesto bandı */
.band{padding:clamp(60px,9vw,110px) var(--pad);border-top:1px solid var(--rule)}
.band p{font:600 clamp(26px,3.8vw,46px)/1.14 var(--display);letter-spacing:-.02em;max-width:22ch}
.band em{font-style:normal;color:var(--accent)}
.endcta .cta{margin-top:2px}
/* hakkında */
.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.val{background:var(--raise);padding:26px 22px;display:flex;flex-direction:column;gap:8px}
.val h3{font-size:16px} .val p{color:var(--ink-2);font-size:var(--t-small)}
@media (max-width:860px){.vals{grid-template-columns:1fr 1fr}.sec-head{grid-template-columns:1fr;gap:10px}}
@media (max-width:520px){.vals{grid-template-columns:1fr}}
footer{padding:40px var(--pad);border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
footer a:hover{color:var(--ink)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
</style>
</head>

<script>
const H = {
  tr: {
    "h.nav.products":"Ürünler","h.nav.about":"Hakkımızda","h.cta.products":"Ürünleri gör","h.cta.about":"Hakkımızda",
    "h.hero.kicker":"WAESNA · Yazılım stüdyosu",
    "h.hero.title":"Yazılım <em>senin</em> bilgisayarında. Abonelik yok.",
    "h.hero.lead":"WAESNA; verini kendi cihazında tutan, tek seferlik ödemeyle sahip olduğun masaüstü yazılımlar geliştirir. Bulut zorunluluğu yok, kota yok — araçların gerçekten senin.",
    "h.trust.1":"Tek seferlik ödeme","h.trust.2":"Çevrimdışı çalışır","h.trust.3":"Verin sende kalır",
    "h.prod.k":"Ürünler","h.prod.h":"Ürünlerimiz","h.prod.lead":"Her biri kendi başına, aboneliksiz ve tamamen cihazında çalışır.",
    "h.v1.tag":"Yapay zekâ çalışma alanı","h.v1.desc":"Yerel modelle internetsiz çalışan, Word/Excel/PDF üreten masaüstü yapay zekâ.",
    "h.v2.tag":"Yapay zekâ video editörü","h.v2.desc":"Ritme göre kesen, efekt basan, altyazı ekleyen tamamen çevrimdışı video editörü.",
    "h.once":" tek seferlik","h.explore":"İncele","h.new":"Yeni",
    "h.about.k":"Hakkımızda","h.about.h":"Neye inanıyoruz",
    "h.about.lead":"Yazılımın kiralanan değil, sahip olunan bir şey olması gerektiğine inanıyoruz.",
    "h.a1.h":"Verin sende","h.a1.p":"Dosyaların ve içeriğin kendi bilgisayarında kalır; başkasının sunucusunda değil.",
    "h.a2.h":"Tek seferlik","h.a2.p":"Bir kere öde, hep senin. Aylık abonelik yok.",
    "h.a3.h":"Çevrimdışı","h.a3.p":"İnternet olmadan da çalışır; işini internet kesintisi durdurmaz.",
    "h.a4.h":"Sade ve hızlı","h.a4.p":"Gereksiz karmaşa yok; işini yapan, hızlı ve anlaşılır araçlar.",
    "h.manifesto":"Bulut çağında araçların, <em>verinle birlikte</em> sana ait olmalı.",
    "h.cta2.k":"Başla","h.cta2.h":"Hangisiyle başlayalım?","h.cta2.p":"İki ürün, tek felsefe: sahip olduğun, çevrimdışı çalışan yazılım.",
    "h.cta2.v1":"VoyagerOne\u2019ı incele","h.cta2.v2":"Intro\u2019yu incele",
    "h.ft.privacy":"Gizlilik","h.ft.terms":"Koşullar",
  },
  en: {
    "h.nav.products":"Products","h.nav.about":"About","h.cta.products":"See products","h.cta.about":"About",
    "h.hero.kicker":"WAESNA · Software studio",
    "h.hero.title":"Software on <em>your</em> computer. No subscription.",
    "h.hero.lead":"WAESNA builds desktop software that keeps your data on your own device and that you own with a one-time payment. No forced cloud, no quotas — your tools are truly yours.",

    "h.manifesto":"In the age of the cloud, your tools should belong to you — <em>together with your data</em>.",
    "h.cta2.k":"Start","h.cta2.h":"Which one first?","h.cta2.p":"Two products, one philosophy: software you own that works offline.",
    "h.cta2.v1":"Explore VoyagerOne","h.cta2.v2":"Explore Intro",
    "h.ft.privacy":"Privacy","h.ft.terms":"Terms",
  }
};
function homeLang(){ try{const s=localStorage.getItem("waesna_lang"); if(s==="tr"||s==="en")return s;}catch(e){} return (navigator.language||"en").toLowerCase().startsWith("tr")?"tr":"en"; }
function applyLang(lang){
  const d=H[lang]||H.en; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(v!=null)el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(el=>{const v=d[el.dataset.th]; if(v!=null)el.innerHTML=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  try{localStorage.setItem("waesna_lang",lang);}catch(e){}
  const ic=(typeof CONFIG!=='undefined'?CONFIG:{}).intro; if(ic&&ic.price){const p=document.getElementById("introPrice"); if(p)p.firstChild.textContent=ic.price;}
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
applyLang(homeLang());
const C=typeof CONFIG!=='undefined'?CONFIG:{}; if(C.email){const m=document.getElementById("mail"); m.href="mailto:"+C.email; m.textContent=C.email;}
document.getElementById("year").textContent=new Date().getFullYear();
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("on",scrollY>8),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
