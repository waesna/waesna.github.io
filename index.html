.manifesto{background:var(--ink);color:var(--paper);padding:clamp(72px,11vw,170px) 0}

.prods{border-bottom:2px solid var(--ink)}
.prod{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:center;margin:0 calc(var(--pad) * -1);padding:clamp(28px,4vw,60px) var(--pad);border-top:2px solid var(--ink);transition:background .25s,color .25s}

.prod:hover .tile{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.meta{grid-column:8/13;display:grid;gap:16px}
.meta .tag{font-weight:600}
.meta .desc{color:var(--gray);max-width:38ch;transition:color .25s}
.prod:hover .desc{color:#bdbdbd}
.meta .foot-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;border-top:1px solid currentColor}
.meta .pr{font:800 34px/1 var(--display);font-stretch:75%}.meta .pr small{font:400 14px var(--body);margin-left:8px;opacity:.7}
.meta .go{font-weight:600;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}

function homeLang(){ try{const s=localStorage.getItem("waesna_lang"); if(s==="tr"||s==="en")return s;}catch(e){} return (navigator.language||"en").toLowerCase().startsWith("tr")?"tr":"en"; }
function applyLang(lang){
  const d=H[lang]||H.en; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(v!=null)el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(el=>{const v=d[el.dataset.th]; if(v!=null)el.innerHTML=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  try{localStorage.setItem("waesna_lang",lang);}catch(e){}
  const ic=(typeof CONFIG!=='undefined'?CONFIG:{}).intro; if(ic&&ic.price){const p=document.getElementById("introPrice"); if(p)p.firstChild.textContent=ic.price;}
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
applyLang(homeLang());

addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("on",scrollY>8),{passive:true});
