function homeLang(){ try{const s=localStorage.getItem("waesna_lang"); if(s==="tr"||s==="en")return s;}catch(e){} return (navigator.language||"en").toLowerCase().startsWith("tr")?"tr":"en"; }
function applyLang(lang){
  const d=H[lang]||H.en; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(v!=null)el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(el=>{const v=d[el.dataset.th]; if(v!=null)el.innerHTML=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  try{localStorage.setItem("waesna_lang",lang);}catch(e){}
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
