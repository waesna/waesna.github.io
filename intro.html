:root{

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:var(--t-body)/1.65 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.05}
h1{font-size:var(--t-hero)} h2{font-size:var(--t-sec)} h3{font-size:var(--t-card);letter-spacing:-.01em;line-height:1.25}
h1 em{font-style:normal;color:var(--accent)}
.mono{font:500 var(--t-mono)/1.5 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
section{padding:clamp(64px,9vw,120px) var(--pad);border-top:1px solid var(--rule)}
.sec-head{margin-bottom:40px}
.lead{color:var(--ink-2);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:2px;font-size:15px;font-weight:600;border:1px solid var(--ink);transition:.2s var(--ease)}
.btn.solid{background:var(--ink);color:var(--paper)} .btn.solid:hover{background:var(--accent);border-color:var(--accent)}
.btn.line:hover{background:var(--ink);color:var(--paper)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff} .btn.blue:hover{background:var(--accent-2);border-color:var(--accent-2)}

/* nav */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px var(--pad);
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.on{border-bottom-color:var(--rule)}
.logo{display:flex;align-items:center;gap:11px;font:600 15px/1 var(--display);letter-spacing:.16em}
.logo img{height:26px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo img{filter:invert(1)}}
.nav-links{display:flex;gap:24px;font-size:var(--t-small);color:var(--ink-2)} .nav-links a:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.lang button{padding:6px 10px;font:500 12px/1 var(--mono);color:var(--ink-3)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
@media (max-width:860px){.nav-links{display:none}.nav .btn{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,64px);align-items:center;padding:clamp(48px,7vw,96px) var(--pad) clamp(56px,7vw,104px)}
.hero .lead{margin-top:18px;font-size:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:var(--t-small);color:var(--ink-3)}
.trust span{display:flex;align-items:center;gap:7px}
.trust span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (max-width:920px){.hero{grid-template-columns:1fr}}

/* editor mock */
.demo{background:#0B0E13;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 30px 70px -40px rgba(0,0,0,.6)}
.demo-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;background:#11151C;border-bottom:1px solid #1f2530}
.demo-bar i{width:11px;height:11px;border-radius:50%;background:#2a3140}
.demo-bar b{margin-left:8px;color:#8FB4FF;font:600 12px/1 var(--mono);letter-spacing:.1em}
.demo-stage{aspect-ratio:16/9;position:relative;background:linear-gradient(120deg,#1a2embed 0,#101722 100%);display:grid;place-items:center;overflow:hidden}
.demo-stage{background:radial-gradient(120% 120% at 30% 20%,#22304d,#0d1420)}
.demo-mark{width:100px;height:83px}
.demo-cap{position:absolute;left:0;right:0;bottom:12%;text-align:center;font:800 15px var(--body);color:#fff;letter-spacing:.02em;text-transform:uppercase}
.demo-cap b{color:#8FB4FF}
.demo-tl{padding:12px 14px;background:#0e131b;border-top:1px solid #1f2530;display:flex;flex-direction:column;gap:7px}
.demo-fx{display:flex;gap:6px}
.demo-fx span{font:600 10px/1 var(--mono);letter-spacing:.06em;color:#cdd6e6;background:#1c2433;border:1px solid #2a3140;padding:5px 8px;border-radius:4px}
.demo-fx span.b{color:#0B0E13;background:#5C8AFF;border-color:#5C8AFF}
.demo-strip{display:flex;gap:3px;height:34px}
.demo-strip i{flex:1;border-radius:3px;background:linear-gradient(180deg,#2b3852,#1a2233)}
.demo-strip i:nth-child(3){outline:2px solid #5C8AFF;outline-offset:-2px}
.demo-beats{display:flex;gap:3px}
.demo-beats i{flex:1;height:3px;border-radius:2px;background:#243049}
.demo-beats i:nth-child(4n+1){background:#5C8AFF}

/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cell{background:var(--raise);padding:26px 24px;display:flex;flex-direction:column;gap:9px}
.cell h3{margin-top:2px}
.cell p{color:var(--ink-2);font-size:var(--t-small)}

/* price */
.buybox{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;background:var(--raise);border:1px solid var(--rule);border-radius:6px;padding:clamp(24px,4vw,44px)}
.buybox .price{font:600 clamp(40px,6vw,64px)/1 var(--display);letter-spacing:-.03em}
.buybox .price small{display:block;font:400 14px/1.5 var(--body);color:var(--ink-3);margin-top:8px}
.buybox ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:var(--t-small);color:var(--ink-2)}
.buybox li::before{content:"—";color:var(--accent);margin-right:9px}
.buy-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
@media (max-width:760px){.buybox{grid-template-columns:1fr}}

/* download */
.dl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dl{display:flex;flex-direction:column;gap:6px;padding:22px;border:1px solid var(--rule);border-radius:4px;background:var(--raise)}
.dl b{font-family:var(--display);font-size:17px}
.dl span{font-size:13px;color:var(--ink-3)}
.dl a{margin-top:8px;font-size:14px;font-weight:600;color:var(--accent)}
.dl.soon{opacity:.6}
@media (max-width:760px){.dl-grid{grid-template-columns:1fr}}

/* footer */
footer{padding:40px var(--pad);border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
footer a:hover{color:var(--ink)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

function introLang(){ try{ const s=localStorage.getItem("waesna.lang"); if(s)return s; }catch(e){} return (navigator.language||"en").toLowerCase().startsWith("tr")?"tr":"en"; }
function applyLang(lang){
  const d=I[lang]||I.en; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(v!=null)el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(el=>{const v=d[el.dataset.th]; if(v!=null)el.innerHTML=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  try{localStorage.setItem("waesna.lang",lang);}catch(e){}
  wireLinks(d);
}
function wireLinks(d){
  const C=(typeof CONFIG!=='undefined'?CONFIG:{}); const ic=C.intro||{};
  if(ic.price){ document.getElementById("introPrice").firstChild.textContent=ic.price; }
  // Satın al: ödeme linki varsa oraya, yoksa e-posta ile talep
  const buy=document.getElementById("buyBtn");
  if(ic.buy){ buy.href=ic.buy; buy.target="_blank"; buy.rel="noopener"; }
  else if(C.email){ buy.href="mailto:"+C.email+"?subject="+encodeURIComponent("Intro satın alma"); }
  // İndirmeler
  const dl=ic.downloads||{};
  [["dlMac",dl.mac],["dlWin",dl.win||dl.windows],["dlLin",dl.lin||dl.linux]].forEach(([id,url])=>{
    const box=document.getElementById(id); if(!box)return; const a=box.querySelector("a");
    if(url){ a.href=url; a.textContent=(d["i.dl.get"]||"İndir"); box.classList.remove("soon"); }
    else{ a.href="#fiyat"; a.textContent=(d["i.dl.soon"]||"Yakında"); box.classList.add("soon"); }
  });
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
applyLang(introLang());
document.getElementById("year").textContent=new Date().getFullYear();
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("on",scrollY>8),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
