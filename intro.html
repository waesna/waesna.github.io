.stage{background:var(--ink);color:var(--paper);border-radius:14px;overflow:hidden;margin-top:clamp(40px,6vw,88px)}

.strip{display:flex;gap:4px;height:46px}

.beats{display:flex;align-items:flex-end;gap:6px;height:38px}
.beats i{flex:1;height:100%;background:var(--paper);border-radius:3px;transform:scaleY(.22);transform-origin:bottom;animation:beat 3.6s var(--ease) infinite;animation-delay:calc(var(--k) * .3s)}

.buy li{padding-left:24px;position:relative;font-size:18px}
.buy li::before{content:"";position:absolute;left:0;top:.72em;width:13px;border-top:3px solid var(--ink);border-radius:3px;transform:rotate(49deg)}
.buy .cta{grid-column:1/-1;margin-top:0}

.idl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:clamp(14px,3vw,40px);align-items:center;padding:clamp(18px,2.4vw,32px) clamp(8px,1vw,16px);border-bottom:1px solid var(--rule)}

@media (max-width:640px){.idl{grid-template-columns:1fr auto}.idl span{display:none}}

function introLang(){ try{ const s=localStorage.getItem("waesna_lang"); if(s)return s; }catch(e){} return (navigator.language||"en").toLowerCase().startsWith("tr")?"tr":"en"; }
function applyLang(lang){
  const d=I[lang]||I.en; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(v!=null)el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(el=>{const v=d[el.dataset.th]; if(v!=null)el.innerHTML=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  try{localStorage.setItem("waesna_lang",lang);}catch(e){}
  wireLinks(d);
}
function wireLinks(d){
  const C=(typeof CONFIG!=='undefined'?CONFIG:{}); const ic=C.intro||{};
  if(ic.price){ document.getElementById("introPrice").firstChild.textContent=ic.price; }
  // Satın al: ödeme linki varsa oraya, yoksa e-posta ile talep
  const buy=document.getElementById("buyBtn");
  if(ic.buy){ buy.href=ic.buy; buy.target="_blank"; buy.rel="noopener"; }
  else if(C.email){ buy.href="mailto:"+C.email+"?subject="+encodeURIComponent("Intro satın alma"); }
  // İndirmeler
  const dl=ic.downloads||{};
  [["dlMac",dl.mac],["dlWin",dl.win||dl.windows],["dlLin",dl.lin||dl.linux]].forEach(([id,url])=>{
    const box=document.getElementById(id); if(!box)return; const a=box.querySelector("a");
    if(url){ a.href=url; a.textContent=(d["i.dl.get"]||"İndir"); box.classList.remove("soon"); }
    else{ a.href="#fiyat"; a.textContent=(d["i.dl.soon"]||"Yakında"); box.classList.add("soon"); }
  });
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
applyLang(introLang());
document.getElementById("year").textContent=new Date().getFullYear();
addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("on",scrollY>8),{passive:true});
